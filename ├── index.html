<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MarkCine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 MarkCine</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Filmes</a>
            <a href="#">Séries</a>
            <a href="#">Minha Lista</a>
        </nav>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar filmes..."
        >
    </header>

    <main>

        <section class="hero">
            <div>
                <h2>Bem-vindo ao MarkCine</h2>

                <p>
                    Encontre filmes e séries para assistir.
                </p>

                <button>Explorar agora</button>
            </div>
        </section>

        <section>
            <h2>🔥 Filmes em destaque</h2>

            <div id="filmes" class="catalogo">

                <div class="filme">
                <div class="poster">
    <img src="img/filme1.jpg" alt="Filme 1">
</div>

  <div class="poster">
    <img src="img/filme2.jpg" alt="Filme 2">
</div>
 
<div class="poster">
    <img src="img/filme3.jpg" alt="Filme 3">
</div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
